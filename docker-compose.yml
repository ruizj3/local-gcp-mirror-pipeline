version: '3.8'

services:
  # 1. Message Broker (Mirrors GCP Pub/Sub)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 2. Local Analytics Warehouse (Mirrors BigQuery/Cloud SQL)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_password
      POSTGRES_DB: analytics_warehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2b. Web UI for querying the warehouse (Mirrors BigQuery Console query editor)
  adminer:
    image: adminer:4.8.1
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  # 3. Pipeline Workflow Orchestrator (Mirrors GCP Cloud Composer)
  airflow:
    image: apache/airflow:2.7.1-python3.10
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8085:8080"
    command: >
      bash -c "airflow db init && 
      airflow users create --username admin --password admin --firstname First --lastname Last --role Admin --email admin@example.com && 
      exec airflow webserver"

volumes:
  postgres_data:
